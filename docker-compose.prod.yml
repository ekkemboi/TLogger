services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tradelogger
      POSTGRES_USER: tradelogger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradelogger -d tradelogger"]
      interval: 5s
      timeout: 5s
      retries: 5

  flask:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://tradelogger:${POSTGRES_PASSWORD:-changeme}@postgres:5432/tradelogger
      - SECRET_KEY=${SECRET_KEY:-changeme}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web/static:/usr/share/nginx/html/static:ro
    depends_on:
      - flask

volumes:
  postgres_data:
