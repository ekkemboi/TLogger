<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TradeLogger{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'bg-primary': 'var(--bg-primary)',
                        'bg-secondary': 'var(--bg-secondary)',
                        'bg-surface': 'var(--bg-surface)',
                        'text-primary': 'var(--text-primary)',
                        'text-light': 'var(--text-light)',
                        'text-secondary': 'var(--text-secondary)',
                        'text-tertiary': 'var(--text-tertiary)',
                        'accent-primary': 'var(--accent-primary)',
                        'accent-primary-hover': 'var(--accent-primary-hover)',
                        'success': 'var(--success)',
                        'error': 'var(--error)',
                        'warning': 'var(--warning)',
                        'border-default': 'var(--border-default)',
                    },
                    fontFamily: {
                        'sans': ['ui-sans-serif', 'system-ui', 'sans-serif', '"Apple Color Emoji"', '"Segoe UI Emoji"', '"Segoe UI Symbol"', '"Noto Color Emoji"'],
                    },
                    borderRadius: {
                        'none': '0px',
                        'sm': '2px',
                        'md': '4px',
                        'lg': '8px',
                        'xl': '12px',
                    }
                }
            }
        }
    </script>
    <style>
        /* Light mode (default) */
        :root {
            --bg-primary: #FFFFFF;
            --bg-secondary: #F8FAFC;
            --bg-surface: #F1F5F9;
            --text-primary: #0F172A;
            --text-light: #64748B;
            --text-secondary: #475569;
            --text-tertiary: #94A3B8;
            --accent-primary: #22C55E;
            --accent-primary-hover: #16A34A;
            --success: #22C55E;
            --error: #EF4444;
            --warning: #F59E0B;
            --border-default: #E2E8F0;
        }

        /* Dark mode */
        .dark {
            --bg-primary: #0F172A;
            --bg-secondary: #1E293B;
            --bg-surface: #334155;
            --text-primary: #F8FAFC;
            --text-light: #94A3B8;
            --text-secondary: #CBD5E1;
            --text-tertiary: #64748B;
            --accent-primary: #22C55E;
            --accent-primary-hover: #4ADE80;
            --success: #22C55E;
            --error: #EF4444;
            --warning: #F59E0B;
            --border-default: #334155;
        }

        * {
            font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
        }

        .sidebar-link {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.2s;
            border-radius: 8px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-link:hover {
            color: var(--text-primary);
            background-color: var(--bg-surface);
        }

        .sidebar-link svg {
            stroke: currentColor;
            width: 18px;
            height: 18px;
        }

        .sidebar-link.active {
            color: var(--accent-primary);
            background-color: rgba(34, 197, 94, 0.1);
        }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-default);
            border-radius: 12px;
        }

        .btn-primary {
            background-color: var(--accent-primary);
            color: #FFFFFF;
            font-size: 13px;
            font-weight: 600;
            border: none;
            padding: 10px 18px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 8px;
        }

        .btn-primary:hover {
            background-color: var(--accent-primary-hover);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 500;
            border: 1px solid var(--border-default);
            padding: 10px 18px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 8px;
        }

        .btn-secondary:hover {
            background-color: var(--bg-surface);
        }

        .btn-danger {
            background-color: var(--error);
            color: #FFFFFF;
            font-size: 13px;
            font-weight: 600;
            border: none;
            padding: 10px 18px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 8px;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-light);
        }

        .input {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-default);
            color: var(--text-primary);
            font-size: 14px;
            padding: 10px 14px;
            width: 100%;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
        }

        .input::placeholder {
            color: var(--text-tertiary);
        }

        .account-switcher {
            height: 40px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-default);
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .account-switcher:hover {
            border-color: var(--accent-primary);
        }

        .account-switcher-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--accent-primary);
        }

        .account-switcher-arrow {
            font-size: 10px;
            color: var(--text-light);
        }

        .account-switcher select {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
        }

        .table-header {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-light);
        }

        .table-cell {
            font-size: 14px;
            color: var(--text-primary);
        }

        .badge-success {
            background-color: rgba(34, 197, 94, 0.15);
            color: var(--success);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .badge-warning {
            background-color: rgba(245, 158, 11, 0.15);
            color: var(--warning);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .badge-error {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--error);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .pagination-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid var(--border-default);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 8px;
            background-color: var(--bg-secondary);
        }

        .pagination-btn:hover {
            background-color: var(--bg-surface);
        }

        .pagination-btn.active {
            background-color: var(--accent-primary);
            color: #FFFFFF;
            border-color: var(--accent-primary);
        }

        .metric-value {
            font-weight: 700;
            color: var(--text-primary);
        }

        .pnl-positive {
            color: var(--success);
        }

        .pnl-negative {
            color: var(--error);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-default);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-tertiary);
        }

        /* Sidebar specific */
        .sidebar {
            width: 260px;
            min-width: 260px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border-default);
            transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1), min-width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Collapsed sidebar (icon-only mode) */
        .sidebar.collapsed {
            width: 72px;
            min-width: 72px;
        }

        .sidebar.collapsed .sidebar-label {
            display: none !important;
        }

        .sidebar.collapsed .sidebar-header {
            justify-content: center;
            padding: 16px 8px;
            position: relative;
        }

        .sidebar.collapsed .sidebar-toggle-btn {
            position: absolute;
            right: -10px;
            top: 18px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-default);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.12);
            z-index: 30;
            border-radius: 9999px;
            padding: 3px;
        }

        .sidebar.collapsed #sidebar-toggle-icon {
            transform: rotate(180deg);
        }

        .sidebar.collapsed .sidebar-link {
            justify-content: center;
            padding: 10px;
        }

        .sidebar.collapsed .account-switcher {
            justify-content: center;
            padding: 8px;
        }

        .sidebar.collapsed .account-switcher-name,
        .sidebar.collapsed .account-switcher-arrow {
            display: none !important;
        }

        .sidebar.collapsed #theme-toggle {
            justify-content: center;
            padding: 10px;
        }

        .sidebar.collapsed #user-nav-section .flex {
            justify-content: center;
        }

        .sidebar.collapsed #user-nav-section span,
        .sidebar.collapsed #user-nav-section button {
            display: none !important;
        }

        /* Keyboard Accessibility - Focus styling */
        :focus-visible {
            outline: 2px solid var(--accent-primary) !important;
            outline-offset: 2px !important;
        }

        .sidebar-link:focus-visible {
            outline: 2px solid var(--accent-primary) !important;
            outline-offset: -2px !important;
        }

        /* Main content area */
        .main-content {
            flex: 1;
            overflow: auto;
            padding: 16px 24px;
            height: 100vh;
            min-width: 0;
            transition: opacity 0.2s ease-in-out;
        }
    </style>
    {% block head %}{% endblock %}
</head>

<body class="flex">
    {% if not htmx_request %}
    <!-- Skip link for keyboard accessibility -->
    <a href="#main-content"
        class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:px-4 focus:py-2 focus:bg-accent-primary focus:text-white focus:rounded-lg focus:shadow-lg focus:outline-none focus:ring-2 focus:ring-white">
        Skip to main content
    </a>

    <!-- Top Loading Bar for smooth page transitions -->
    <div id="loading-bar" class="fixed top-0 left-0 right-0 h-1 bg-accent-primary z-50 transform origin-left transition-all duration-300 pointer-events-none opacity-0" style="transform: scaleX(0);"></div>

    <!-- Sidebar - only for normal page loads -->
    <aside id="app-sidebar" class="sidebar flex flex-col h-screen transition-all duration-200 ease-in-out relative flex-shrink-0" aria-label="Main Navigation">
        <!-- Logo & Collapse Button -->
        <div class="sidebar-header p-4 border-b border-border-default flex items-center justify-between min-h-[65px]">
            <a href="/" hx-get="/" hx-target="main" hx-push-url="true" hx-swap="innerHTML" class="flex items-center gap-3 overflow-hidden rounded-lg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-primary" title="TradeLogger Dashboard">
                <div class="w-8 h-8 bg-accent-primary rounded-lg flex items-center justify-center flex-shrink-0 shadow-sm">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                    </svg>
                </div>
                <span class="text-lg font-bold text-text-primary tracking-tight sidebar-label whitespace-nowrap">TradeLogger</span>
            </a>
            <button id="sidebar-toggle-btn"
                onclick="toggleSidebar()"
                type="button"
                aria-label="Toggle sidebar collapse"
                title="Toggle sidebar (Ctrl+B)"
                class="sidebar-toggle-btn p-1.5 rounded-lg text-text-light hover:text-text-primary hover:bg-bg-surface transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-primary">
                <svg id="sidebar-toggle-icon" class="w-4 h-4 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
                </svg>
            </button>
        </div>

        <!-- Navigation -->
        <nav class="sidebar-nav flex-1 p-3 space-y-1 overflow-y-auto overflow-x-hidden" role="navigation" aria-label="Sidebar Links">
            <a href="/" hx-get="/" hx-target="main" hx-push-url="true" hx-swap="innerHTML"
                title="Dashboard"
                class="sidebar-link {% if request.path == '/' %}active{% endif %}">
                <i data-lucide="layout-dashboard" class="flex-shrink-0"></i>
                <span class="sidebar-label whitespace-nowrap">Dashboard</span>
            </a>
            <a href="/trades" hx-get="/trades" hx-target="main" hx-push-url="true" hx-swap="innerHTML"
                title="Trades"
                class="sidebar-link {% if request.path == '/trades' %}active{% endif %}">
                <i data-lucide="trending-up" class="flex-shrink-0"></i>
                <span class="sidebar-label whitespace-nowrap">Trades</span>
            </a>
            <a href="/favorites" hx-get="/favorites" hx-target="main" hx-push-url="true" hx-swap="innerHTML"
                title="Favorites"
                class="sidebar-link {% if request.path == '/favorites' %}active{% endif %}">
                <i data-lucide="star" class="flex-shrink-0"></i>
                <span class="sidebar-label whitespace-nowrap">Favorites</span>
            </a>
            <a href="/accounts" hx-get="/accounts" hx-target="main" hx-push-url="true" hx-swap="innerHTML"
                title="Accounts"
                class="sidebar-link {% if request.path == '/accounts' %}active{% endif %}">
                <i data-lucide="wallet" class="flex-shrink-0"></i>
                <span class="sidebar-label whitespace-nowrap">Accounts</span>
            </a>
            <a href="/backtest" hx-get="/backtest" hx-target="main" hx-push-url="true" hx-swap="innerHTML"
                title="Backtest"
                class="sidebar-link {% if request.path == '/backtest' %}active{% endif %}">
                <i data-lucide="play-circle" class="flex-shrink-0"></i>
                <span class="sidebar-label whitespace-nowrap">Backtest</span>
            </a>
            <a href="/import" hx-get="/import" hx-target="main" hx-push-url="true" hx-swap="innerHTML"
                title="Import"
                class="sidebar-link {% if request.path == '/import' %}active{% endif %}">
                <i data-lucide="upload" class="flex-shrink-0"></i>
                <span class="sidebar-label whitespace-nowrap">Import</span>
            </a>
            <a href="/analytics" hx-get="/analytics" hx-target="main" hx-push-url="true" hx-swap="innerHTML"
                title="Analytics"
                class="sidebar-link {% if request.path == '/analytics' %}active{% endif %}">
                <i data-lucide="bar-chart-3" class="flex-shrink-0"></i>
                <span class="sidebar-label whitespace-nowrap">Analytics</span>
            </a>
        </nav>

        <!-- Bottom Section -->
        <div class="sidebar-footer p-3 border-t border-border-default space-y-2">
            <!-- Account Switcher -->
            <div class="account-switcher" title="Select Account">
                <i data-lucide="building-2" class="w-4 h-4 text-text-light flex-shrink-0"></i>
                <span class="account-switcher-name sidebar-label whitespace-nowrap overflow-hidden text-ellipsis" id="account-switcher-label">All Accounts</span>
                <i data-lucide="chevron-down" class="w-4 h-4 text-text-light ml-auto sidebar-label flex-shrink-0"></i>
                <select id="account-switcher" aria-label="Select Trading Account">
                    <option value="">All Accounts</option>
                </select>
            </div>

            <!-- Theme Toggle -->
            <button id="theme-toggle" onclick="toggleTheme()" type="button" aria-label="Toggle Theme" title="Toggle Theme"
                class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-text-secondary hover:bg-bg-surface transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-primary">
                <svg id="theme-icon" class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
                <span class="text-sm font-medium sidebar-label whitespace-nowrap">Toggle Theme</span>
            </button>

            <!-- User Section -->
            <div id="user-nav-section" class="overflow-hidden">
                <!-- Will be populated by auth.js -->
            </div>
        </div>
    </aside>
    {% endif %}

    <!-- Main Content -->
    <main id="main-content" class="main-content bg-bg-primary" role="main">
        {% block content %}{% endblock %}
    </main>

    {% if not htmx_request %}
    <script>
        // Sidebar Expand / Collapse
        function toggleSidebar() {
            const sidebar = document.querySelector('aside.sidebar');
            if (!sidebar) return;
            const isCollapsed = sidebar.classList.toggle('collapsed');
            localStorage.setItem('sidebar_collapsed', isCollapsed ? 'true' : 'false');
            const toggleBtn = document.getElementById('sidebar-toggle-btn');
            if (toggleBtn) {
                toggleBtn.setAttribute('aria-expanded', (!isCollapsed).toString());
            }
        }

        function initSidebar() {
            const savedState = localStorage.getItem('sidebar_collapsed');
            const sidebar = document.querySelector('aside.sidebar');
            if (!sidebar) return;
            // Responsive auto-collapse on small screens (< 768px) if no preference saved
            const isMobile = window.innerWidth < 768;
            if (savedState === 'true' || (savedState === null && isMobile)) {
                sidebar.classList.add('collapsed');
                const toggleBtn = document.getElementById('sidebar-toggle-btn');
                if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'false');
            }
        }

        // Keyboard navigation support
        document.addEventListener('keydown', function(evt) {
            // Ctrl+B or Cmd+B to toggle sidebar
            if ((evt.ctrlKey || evt.metaKey) && (evt.key === 'b' || evt.key === 'B')) {
                evt.preventDefault();
                toggleSidebar();
            }
            // Alt+S as accessible alternative
            if (evt.altKey && (evt.key === 's' || evt.key === 'S')) {
                evt.preventDefault();
                toggleSidebar();
            }
            // Arrow navigation within sidebar links
            if (evt.key === 'ArrowDown' || evt.key === 'ArrowUp') {
                const links = Array.from(document.querySelectorAll('.sidebar-nav .sidebar-link'));
                const focused = document.activeElement;
                const index = links.indexOf(focused);
                if (index !== -1) {
                    evt.preventDefault();
                    const nextIndex = evt.key === 'ArrowDown'
                        ? (index + 1) % links.length
                        : (index - 1 + links.length) % links.length;
                    links[nextIndex].focus();
                }
            }
        });

        // Theme Toggle
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
            }

            updateThemeIcon();
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon();
            window.dispatchEvent(new CustomEvent('themeChanged', { detail: { isDark } }));
        }

        function updateThemeIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            const themeIcon = document.getElementById('theme-icon');
            if (!themeIcon) return;

            // Sun icon for dark mode, Moon icon for light mode
            if (isDark) {
                themeIcon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
            } else {
                themeIcon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
            }
        }

        // Global Account Switcher
        async function loadAccountSwitcher() {
            try {
                const response = await fetch('/api/accounts');
                const data = await response.json();
                const select = document.getElementById('account-switcher');
                if (!select) return;

                select.innerHTML = '<option value="">All Accounts</option>';
                (data.accounts || []).forEach(account => {
                    const option = document.createElement('option');
                    option.value = account.id;
                    option.textContent = account.name;
                    select.appendChild(option);
                });

                // Restore selection from localStorage
                const savedAccountId = localStorage.getItem('selectedAccountId');
                if (savedAccountId) {
                    select.value = savedAccountId;
                    // Update label to match
                    const label = document.getElementById('account-switcher-label');
                    if (label) {
                        label.textContent = select.options[select.selectedIndex].text;
                    }
                }
            } catch (error) {
                console.error('Failed to load accounts:', error);
            }
        }

        function initAccountSwitcher() {
            loadAccountSwitcher();
            document.getElementById('account-switcher').addEventListener('change', function () {
                localStorage.setItem('selectedAccountId', this.value);
                // Update label
                const label = document.getElementById('account-switcher-label');
                if (label) {
                    label.textContent = this.options[this.selectedIndex].text;
                }
                // Trigger custom event so pages can react
                window.dispatchEvent(new CustomEvent('accountChanged', { detail: { accountId: this.value } }));
            });
        }

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function () {
                initTheme();
                initSidebar();
                initAccountSwitcher();
                if (window.lucide) lucide.createIcons();
            });
        } else {
            initTheme();
            initSidebar();
            initAccountSwitcher();
            if (window.lucide) lucide.createIcons();
        }

        // HTMX Smooth Page Transitions and Event Handlers
        document.addEventListener('htmx:beforeRequest', function (evt) {
            const bar = document.getElementById('loading-bar');
            if (bar) {
                bar.style.transform = 'scaleX(0.7)';
                bar.style.opacity = '1';
            }
            const main = document.querySelector('main.main-content');
            if (main) {
                main.style.opacity = '0.6';
            }
        });

        document.addEventListener('htmx:afterSwap', function (evt) {
            // Finish top loading progress bar
            const bar = document.getElementById('loading-bar');
            if (bar) {
                bar.style.transform = 'scaleX(1)';
                setTimeout(() => {
                    bar.style.opacity = '0';
                    setTimeout(() => {
                        bar.style.transform = 'scaleX(0)';
                    }, 250);
                }, 150);
            }

            // Restore main content opacity smoothly
            const main = document.querySelector('main.main-content');
            if (main) {
                main.style.opacity = '1';
            }

            // Re-initialize Lucide icons after content swap
            if (window.lucide) lucide.createIcons();

            // Update active sidebar link based on current URL
            updateActiveSidebarLink();

            // Re-initialize page-specific scripts
            if (window.initPageScripts) {
                window.initPageScripts();
            }
        });

        document.addEventListener('htmx:requestError', function(evt) {
            const bar = document.getElementById('loading-bar');
            if (bar) {
                bar.style.opacity = '0';
                bar.style.transform = 'scaleX(0)';
            }
            const main = document.querySelector('main.main-content');
            if (main) {
                main.style.opacity = '1';
            }
        });

        // Update active sidebar link
        function updateActiveSidebarLink() {
            const currentPath = window.location.pathname;
            document.querySelectorAll('.sidebar-link').forEach(link => {
                link.classList.remove('active');
                // Remove active class logic - compare href with current path
                const linkPath = link.getAttribute('href');
                if (linkPath === currentPath || (currentPath === '/' && linkPath === '/')) {
                    link.classList.add('active');
                }
            });
        }

        // HTMX Error Handler - Fallback to full page reload
        document.addEventListener('htmx:error', function (evt) {
            console.warn('HTMX request failed, falling back to full page load:', evt.detail.error);
            // Let the default link behavior handle it (full page reload)
        });

        // Handle OOB account dropdown updates
        document.addEventListener('accountDropdownUpdated', function () {
            // Re-initialize account switcher after OOB update
            loadAccountSwitcher();
        });

        // HTMX Configuration: Include credentials (cookies) with all requests
        document.body.addEventListener('htmx:configRequest', function (evt) {
            evt.detail.withCredentials = true;
        });
    </script>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    {% endif %}
    {% block scripts %}{% endblock %}
</body>

</html>
