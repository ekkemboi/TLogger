{% extends "base.html" %}

{% block title %}Brokers - TradeLogger{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold text-text-primary">Broker Connections</h1>
        <button onclick="showAddBroker()" class="btn-primary flex items-center gap-2">
            <i data-lucide="plus" class="w-4 h-4"></i>
            Add Connection
        </button>
    </div>

    <!-- Add Broker Modal -->
    <div id="broker-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50">
        <div class="card p-6 w-full max-w-md mx-4">
            <h2 class="text-lg font-bold text-text-primary mb-4">Add Broker Connection</h2>
            <div class="space-y-4">
                <div>
                    <label class="label mb-1 block">Broker</label>
                    <select id="br-broker" class="input">
                        <option value="tradovate">Tradovate</option>
                        <option value="ctrader">cTrader</option>
                        <option value="mt4">MetaTrader 4/5</option>
                        <option value="ninjatrader">NinjaTrader</option>
                    </select>
                </div>
                <div>
                    <label class="label mb-1 block">Label</label>
                    <input id="br-label" class="input" placeholder="My Trading Account">
                </div>
                <div>
                    <label class="label mb-1 block">API Key</label>
                    <input id="br-api-key" class="input" type="password">
                </div>
                <div>
                    <label class="label mb-1 block">API Secret</label>
                    <input id="br-api-secret" class="input" type="password">
                </div>
                <div>
                    <label class="label mb-1 block">Account ID (optional)</label>
                    <input id="br-account-id" class="input" placeholder="acc-001">
                </div>
                <div class="flex gap-3 pt-2">
                    <button onclick="saveBroker()" class="btn-primary flex-1">Save</button>
                    <button onclick="hideAddBroker()" class="btn-secondary flex-1">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Connection List -->
    <div id="broker-list" class="space-y-3">
        <div class="text-center text-text-light py-8">
            <p>No broker connections yet</p>
        </div>
    </div>
</div>

<script>
function showAddBroker() { document.getElementById('broker-modal').classList.remove('hidden'); }
function hideAddBroker() { document.getElementById('broker-modal').classList.add('hidden'); }

async function saveBroker() {
    const data = {
        broker: document.getElementById('br-broker').value,
        label: document.getElementById('br-label').value,
        api_key: document.getElementById('br-api-key').value,
        api_secret: document.getElementById('br-api-secret').value,
        account_id: document.getElementById('br-account-id').value,
    };
    if (!data.label) { alert('Label is required'); return; }

    await fetch('/api/brokers', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data),
    });
    hideAddBroker();
    loadBrokers();
}

async function loadBrokers() {
    const res = await fetch('/api/brokers');
    const d = await res.json();
    const container = document.getElementById('broker-list');
    if (d.connections.length === 0) {
        container.innerHTML = '<div class="text-center text-text-light py-8"><p>No broker connections yet</p></div>';
        return;
    }
    container.innerHTML = d.connections.map(c => `
        <div class="card p-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-accent-primary/10 rounded-lg flex items-center justify-center">
                    <i data-lucide="link" class="w-5 h-5 text-accent-primary"></i>
                </div>
                <div>
                    <p class="font-medium text-text-primary">${c.label}</p>
                    <p class="text-sm text-text-light">${c.broker} ${c.account_id ? '· ' + c.account_id : ''}</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-xs px-2 py-1 rounded-full ${c.is_active ? 'bg-success/10 text-success' : 'bg-bg-surface text-text-light'}">
                    ${c.is_active ? 'Active' : 'Inactive'}
                </span>
                <button onclick="deleteBroker('${c.id}')" class="btn-danger text-xs px-3 py-1">Delete</button>
            </div>
        </div>
    `).join('');
    if (window.lucide) lucide.createIcons();
}

async function deleteBroker(id) {
    if (!confirm('Delete this connection?')) return;
    await fetch(`/api/brokers/${id}`, {method: 'DELETE'});
    loadBrokers();
}

loadBrokers();
</script>
{% endblock %}
