<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TradeLogger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'bg-primary': 'var(--bg-primary)',
                        'bg-secondary': 'var(--bg-secondary)',
                        'bg-surface': 'var(--bg-surface)',
                        'text-primary': 'var(--text-primary)',
                        'text-secondary': 'var(--text-secondary)',
                        'accent-primary': 'var(--accent-primary)',
                        'accent-primary-hover': 'var(--accent-primary-hover)',
                        'error': 'var(--error)',
                        'border-default': 'var(--border-default)',
                    },
                    fontFamily: {
                        'sans': ['ui-sans-serif', 'system-ui', 'sans-serif', '"Apple Color Emoji"', '"Segoe UI Emoji"', '"Segoe UI Symbol"', '"Noto Color Emoji"'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-primary: #FFFFFF;
            --bg-secondary: #F8FAFC;
            --bg-surface: #F1F5F9;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --accent-primary: #22C55E;
            --accent-primary-hover: #16A34A;
            --error: #EF4444;
            --border-default: #E2E8F0;
        }

        .dark {
            --bg-primary: #0F172A;
            --bg-secondary: #1E293B;
            --bg-surface: #334155;
            --text-primary: #F8FAFC;
            --text-secondary: #CBD5E1;
            --accent-primary: #22C55E;
            --accent-primary-hover: #4ADE80;
            --error: #EF4444;
            --border-default: #334155;
        }

        * {
            font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        }

        .active-tab {
            color: var(--accent-primary);
            border-bottom-color: var(--accent-primary);
        }
    </style>
</head>
<body class="h-screen overflow-hidden flex items-center justify-center p-4 bg-bg-primary text-text-primary">
    <!-- Theme Toggle -->
    <button id="theme-toggle" onclick="toggleTheme()" class="fixed top-4 right-4 z-50 p-2.5 rounded-xl bg-bg-secondary border border-border-default text-text-secondary hover:bg-bg-surface transition-all">
        <svg id="theme-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
    </button>

    <div class="w-full max-w-[min(420px,90vw)] bg-bg-secondary border border-border-default rounded-2xl p-[clamp(1rem,4vh,2.5rem)] max-h-[95vh] flex flex-col justify-center">
        <!-- Logo -->
        <div class="text-center mb-[clamp(0.5rem,1.5vh,1.5rem)]">
            <div class="w-[clamp(2.5rem,5vh,3.5rem)] h-[clamp(2.5rem,5vh,3.5rem)] bg-accent-primary rounded-xl mx-auto mb-[clamp(0.5rem,1vh,1rem)] flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
                </svg>
            </div>
            <h1 class="font-bold text-text-primary text-[clamp(1.25rem,3.5vh,1.75rem)] tracking-tight">TradeLogger</h1>
            <p class="text-text-secondary text-[clamp(0.75rem,2vh,0.875rem)] mt-[clamp(0.25rem,0.5vh,0.5rem)]">Sign in to your account</p>
        </div>

        <!-- Tabs -->
        <div class="flex justify-center mb-[clamp(0.75rem,2vh,1.5rem)] border-b border-border-default">
            <button class="font-semibold py-[clamp(0.5rem,1.5vh,0.75rem)] px-[clamp(0.75rem,2vh,1.5rem)] bg-transparent border-none text-text-secondary cursor-pointer border-b-2 border-transparent transition-all hover:text-text-primary text-[clamp(0.75rem,2vh,0.875rem)] [&.active]:text-accent-primary [&.active]:border-accent-primary active-tab" id="tab-login" onclick="switchTab('login')">Sign In</button>
            <button class="font-semibold py-[clamp(0.5rem,1.5vh,0.75rem)] px-[clamp(0.75rem,2vh,1.5rem)] bg-transparent border-none text-text-secondary cursor-pointer border-b-2 border-transparent transition-all hover:text-text-primary text-[clamp(0.75rem,2vh,0.875rem)] [&.active]:text-accent-primary [&.active]:border-accent-primary" id="tab-register" onclick="switchTab('register')">Register</button>
        </div>

        <!-- Error Message -->
        <div id="error-message" class="hidden text-error text-[clamp(0.75rem,1.8vh,0.875rem)] p-[clamp(0.5rem,1.2vh,0.75rem)] rounded-lg bg-error/10 mb-[clamp(0.5rem,1.5vh,1rem)]"></div>

        <!-- Google Login -->
        <button id="google-btn" class="w-full bg-bg-surface border border-border-default text-text-primary font-semibold py-[clamp(0.5rem,1.5vh,0.875rem)] px-[clamp(1rem,2vh,1.5rem)] rounded-lg text-[clamp(0.7rem,1.8vh,0.8125rem)] hover:bg-bg-primary hover:border-accent-primary transition-all flex items-center justify-center gap-[clamp(0.5rem,1vh,0.75rem)] mb-[clamp(0.75rem,2vh,1.5rem)]" onclick="loginWithGoogle()">
            <svg class="w-[clamp(1rem,2.5vh,1.25rem)] h-[clamp(1rem,2.5vh,1.25rem)]" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continue with Google
        </button>

        <div class="flex items-center gap-[clamp(0.75rem,2vh,1rem)] text-text-secondary text-[clamp(0.7rem,1.5vh,0.75rem)] mb-[clamp(0.75rem,2vh,1.5rem)]">
            <div class="flex-1 h-px bg-border-default"></div>
            <span>or</span>
            <div class="flex-1 h-px bg-border-default"></div>
        </div>

        <!-- Login Form -->
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="mb-[clamp(0.5rem,1.2vh,1rem)]">
                <label class="block text-text-secondary text-[clamp(0.65rem,1.5vh,0.75rem)] font-semibold uppercase tracking-wider mb-[clamp(0.25rem,0.5vh,0.5rem)]">Email</label>
                <input type="email" id="login-email" class="w-full bg-bg-surface border border-border-default rounded-lg py-[clamp(0.5rem,1.2vh,0.75rem)] px-[clamp(0.75rem,1.5vh,1rem)] text-text-primary text-[clamp(0.8rem,1.8vh,0.875rem)] focus:outline-none focus:border-accent-primary focus:ring-2 focus:ring-accent-primary/20 transition-all" placeholder="you@example.com" required>
            </div>
            <div class="mb-[clamp(0.5rem,1.2vh,1rem)]">
                <label class="block text-text-secondary text-[clamp(0.65rem,1.5vh,0.75rem)] font-semibold uppercase tracking-wider mb-[clamp(0.25rem,0.5vh,0.5rem)]">Password</label>
                <input type="password" id="login-password" class="w-full bg-bg-surface border border-border-default rounded-lg py-[clamp(0.5rem,1.2vh,0.75rem)] px-[clamp(0.75rem,1.5vh,1rem)] text-text-primary text-[clamp(0.8rem,1.8vh,0.875rem)] focus:outline-none focus:border-accent-primary focus:ring-2 focus:ring-accent-primary/20 transition-all" placeholder="••••••••" required>
            </div>
            <div class="flex items-center justify-between mb-[clamp(0.75rem,1.5vh,1rem)]">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="remember-me" class="w-4 h-4 rounded border-border-default text-accent-primary focus:ring-accent-primary">
                    <span class="text-sm text-text-secondary">Remember me</span>
                </label>
                <a href="#" class="text-sm text-accent-primary hover:text-accent-primary-hover font-medium">Forgot password?</a>
            </div>
            <button type="submit" id="login-submit" class="w-full bg-accent-primary text-white font-semibold uppercase tracking-wider py-[clamp(0.5rem,1.5vh,0.875rem)] px-[clamp(1rem,2vh,1.5rem)] rounded-lg text-[clamp(0.7rem,1.5vh,0.8125rem)] hover:bg-accent-primary-hover transition-all disabled:opacity-60 disabled:cursor-not-allowed">Sign In</button>
        </form>

        <!-- Register Form -->
        <form id="register-form" onsubmit="handleRegister(event)" style="display: none;">
            <div class="mb-[clamp(0.5rem,1.2vh,1rem)]">
                <label class="block text-text-secondary text-[clamp(0.65rem,1.5vh,0.75rem)] font-semibold uppercase tracking-wider mb-[clamp(0.25rem,0.5vh,0.5rem)]">Name</label>
                <input type="text" id="register-name" class="w-full bg-bg-surface border border-border-default rounded-lg py-[clamp(0.5rem,1.2vh,0.75rem)] px-[clamp(0.75rem,1.5vh,1rem)] text-text-primary text-[clamp(0.8rem,1.8vh,0.875rem)] focus:outline-none focus:border-accent-primary focus:ring-2 focus:ring-accent-primary/20 transition-all" placeholder="John Doe" required>
            </div>
            <div class="mb-[clamp(0.5rem,1.2vh,1rem)]">
                <label class="block text-text-secondary text-[clamp(0.65rem,1.5vh,0.75rem)] font-semibold uppercase tracking-wider mb-[clamp(0.25rem,0.5vh,0.5rem)]">Email</label>
                <input type="email" id="register-email" class="w-full bg-bg-surface border border-border-default rounded-lg py-[clamp(0.5rem,1.2vh,0.75rem)] px-[clamp(0.75rem,1.5vh,1rem)] text-text-primary text-[clamp(0.8rem,1.8vh,0.875rem)] focus:outline-none focus:border-accent-primary focus:ring-2 focus:ring-accent-primary/20 transition-all" placeholder="you@example.com" required>
            </div>
            <div class="mb-[clamp(0.5rem,1.2vh,1rem)]">
                <label class="block text-text-secondary text-[clamp(0.65rem,1.5vh,0.75rem)] font-semibold uppercase tracking-wider mb-[clamp(0.25rem,0.5vh,0.5rem)]">Password</label>
                <input type="password" id="register-password" class="w-full bg-bg-surface border border-border-default rounded-lg py-[clamp(0.5rem,1.2vh,0.75rem)] px-[clamp(0.75rem,1.5vh,1rem)] text-text-primary text-[clamp(0.8rem,1.8vh,0.875rem)] focus:outline-none focus:border-accent-primary focus:ring-2 focus:ring-accent-primary/20 transition-all" placeholder="Min 8 chars, with uppercase, number & special" required>
            </div>
            <div class="mb-[clamp(0.75rem,1.5vh,1rem)]">
                <label class="block text-text-secondary text-[clamp(0.65rem,1.5vh,0.75rem)] font-semibold uppercase tracking-wider mb-[clamp(0.25rem,0.5vh,0.5rem)]">Confirm Password</label>
                <input type="password" id="register-password-confirm" class="w-full bg-bg-surface border border-border-default rounded-lg py-[clamp(0.5rem,1.2vh,0.75rem)] px-[clamp(0.75rem,1.5vh,1rem)] text-text-primary text-[clamp(0.8rem,1.8vh,0.875rem)] focus:outline-none focus:border-accent-primary focus:ring-2 focus:ring-accent-primary/20 transition-all" placeholder="••••••••" required>
            </div>
            <button type="submit" id="register-submit" class="w-full bg-accent-primary text-white font-semibold uppercase tracking-wider py-[clamp(0.5rem,1.5vh,0.875rem)] px-[clamp(1rem,2vh,1.5rem)] rounded-lg text-[clamp(0.7rem,1.5vh,0.8125rem)] hover:bg-accent-primary-hover transition-all disabled:opacity-60 disabled:cursor-not-allowed">Create Account</button>
        </form>
    </div>

    <script>
        // Check if already authenticated
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/status', { credentials: 'include' });
                const data = await response.json();
                if (data.authenticated) {
                    // Already logged in, redirect to dashboard
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirect = urlParams.get('redirect') || '/';
                    window.location.href = redirect;
                }
            } catch (error) {
                console.error('Auth check failed:', error);
            }
        }

        // Run auth check on page load
        checkAuth();

        // Theme Toggle
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
            }
            
            updateThemeIcon();
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            const themeIcon = document.getElementById('theme-icon');
            if (!themeIcon) return;
            
            // Sun icon for dark mode, Moon icon for light mode
            if (isDark) {
                themeIcon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
            } else {
                themeIcon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
            }
        }

        // Initialize theme
        initTheme();

        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const loginTab = document.getElementById('tab-login');
            const registerTab = document.getElementById('tab-register');
            const errorDiv = document.getElementById('error-message');
            
            errorDiv.classList.add('hidden');
            
            if (tab === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                loginTab.classList.add('active-tab');
                registerTab.classList.remove('active-tab');
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                loginTab.classList.remove('active-tab');
                registerTab.classList.add('active-tab');
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
        }

        function hideError() {
            const errorDiv = document.getElementById('error-message');
            errorDiv.classList.add('hidden');
        }

        function setLoading(buttonId, loading) {
            const button = document.getElementById(buttonId);
            button.disabled = loading;
            button.textContent = loading ? 'Please wait...' : (buttonId === 'login-submit' ? 'Sign In' : 'Create Account');
        }

        async function handleLogin(event) {
            event.preventDefault();
            hideError();
            setLoading('login-submit', true);

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const rememberMe = document.getElementById('remember-me').checked;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password, remember_me: rememberMe })
                });

                const data = await response.json();

                if (response.ok) {
                    // Login successful, redirect
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirect = urlParams.get('redirect') || '/';
                    window.location.href = redirect;
                } else {
                    showError(data.error || 'Login failed. Please check your credentials.');
                }
            } catch (error) {
                showError('Network error. Please try again.');
            } finally {
                setLoading('login-submit', false);
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            hideError();
            setLoading('register-submit', true);

            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const passwordConfirm = document.getElementById('register-password-confirm').value;

            // Validate password match
            if (password !== passwordConfirm) {
                showError('Passwords do not match.');
                setLoading('register-submit', false);
                return;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Registration successful, redirect to dashboard
                    window.location.href = '/';
                } else {
                    showError(data.error || 'Registration failed. Please try again.');
                }
            } catch (error) {
                showError('Network error. Please try again.');
            } finally {
                setLoading('register-submit', false);
            }
        }

        function loginWithGoogle() {
            // Redirect to Google OAuth login
            window.location.href = '/api/auth/google/login';
        }
    </script>
</body>
</html>
