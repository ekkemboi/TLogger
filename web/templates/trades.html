{% extends "base.html" %}

{% block title %}TradeLogger - Trades{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="flex justify-between items-center">
        <h1 class="text-2xl font-bold">Trades</h1>
        <div class="flex space-x-2">
            <select id="filter-symbol" class="bg-gray-800 border border-gray-700 rounded-md px-3 py-2 text-sm">
                <option value="">All Symbols</option>
            </select>
            <select id="filter-direction" class="bg-gray-800 border border-gray-700 rounded-md px-3 py-2 text-sm">
                <option value="">All Directions</option>
                <option value="long">Long</option>
                <option value="short">Short</option>
            </select>
            <input type="date" id="filter-start" class="bg-gray-800 border border-gray-700 rounded-md px-3 py-2 text-sm" placeholder="Start Date">
            <input type="date" id="filter-end" class="bg-gray-800 border border-gray-700 rounded-md px-3 py-2 text-sm" placeholder="End Date">
        </div>
    </div>

    <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden">
        <table class="min-w-full divide-y divide-gray-700">
            <thead class="bg-gray-900">
                <tr>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider cursor-pointer" onclick="sortTrades('symbol')">Symbol</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Direction</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Entry</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Take Profit</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">P&L</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Status</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Date</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Actions</th>
                </tr>
            </thead>
            <tbody id="trades-table" class="divide-y divide-gray-700">
                <tr>
                    <td colspan="8" class="px-6 py-4 text-center text-gray-400">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div id="pagination" class="flex justify-center space-x-2"></div>
</div>

<!-- Trade Detail Modal -->
<div id="trade-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
    <div class="bg-gray-800 rounded-lg p-6 max-w-lg w-full mx-4 border border-gray-700">
        <div class="flex justify-between items-center mb-4">
            <h2 id="modal-title" class="text-xl font-bold">Trade Details</h2>
            <button onclick="closeModal()" class="text-gray-400 hover:text-white">&times;</button>
        </div>
        <div id="modal-content" class="space-y-3">
            <!-- Populated by JS -->
        </div>
        <div class="mt-6 flex space-x-3">
            <button onclick="closeModal()" class="flex-1 bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">Close</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;

async function loadTrades(page = 1) {
    currentPage = page;
    const symbol = document.getElementById('filter-symbol').value;
    const direction = document.getElementById('filter-direction').value;
    const startDate = document.getElementById('filter-start').value;
    const endDate = document.getElementById('filter-end').value;

    let url = `/api/trades?page=${page}&per_page=20`;
    if (symbol) url += `&symbol=${symbol}`;
    if (direction) url += `&direction=${direction}`;
    if (startDate) url += `&start_date=${startDate}`;
    if (endDate) url += `&end_date=${endDate}`;

    try {
        const response = await fetch(url);
        const data = await response.json();

        const tbody = document.getElementById('trades-table');
        if (data.trades.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="px-6 py-4 text-center text-gray-400">No trades found</td></tr>';
            return;
        }

        tbody.innerHTML = data.trades.map(trade => `
            <tr class="hover:bg-gray-700 cursor-pointer" onclick="showTradeModal('${trade.id}')">
                <td class="px-4 py-3 whitespace-nowrap font-medium">${trade.symbol}</td>
                <td class="px-4 py-3 whitespace-nowrap">
                    <span class="${trade.direction === 'long' ? 'text-green-400' : 'text-red-400'}">${trade.direction.toUpperCase()}</span>
                </td>
                <td class="px-4 py-3 whitespace-nowrap">${trade.entry_price?.toFixed(2) || '--'}</td>
                <td class="px-4 py-3 whitespace-nowrap">${trade.take_profit?.toFixed(2) || '--'}</td>
                <td class="px-4 py-3 whitespace-nowrap ${trade.pnl >= 0 ? 'text-green-400' : 'text-red-400'}">
                    ${trade.pnl !== null ? '$' + trade.pnl.toFixed(2) : '--'}
                </td>
                <td class="px-4 py-3 whitespace-nowrap">
                    <span class="px-2 py-1 rounded-full text-xs ${trade.status === 'closed' ? 'bg-gray-600' : 'bg-blue-600'}">${trade.status}</span>
                </td>
                <td class="px-4 py-3 whitespace-nowrap text-gray-400 text-sm">${new Date(trade.created_at).toLocaleDateString()}</td>
                <td class="px-4 py-3 whitespace-nowrap" onclick="event.stopPropagation()">
                    <button onclick="deleteTrade('${trade.id}')" class="text-red-400 hover:text-red-300 text-sm">Delete</button>
                </td>
            </tr>
        `).join('');

        // Populate symbol filter
        const symbolSelect = document.getElementById('filter-symbol');
        const symbols = [...new Set(data.trades.map(t => t.symbol))];
        if (symbolSelect.options.length === 1) {
            symbols.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                symbolSelect.appendChild(opt);
            });
        }

        // Pagination
        const pagination = document.getElementById('pagination');
        pagination.innerHTML = '';
        if (data.pages > 1) {
            for (let i = 1; i <= data.pages; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.className = `px-3 py-1 rounded ${i === page ? 'bg-green-600' : 'bg-gray-700 hover:bg-gray-600'}`;
                btn.onclick = () => loadTrades(i);
                pagination.appendChild(btn);
            }
        }
    } catch (error) {
        console.error('Failed to load trades:', error);
    }
}

async function showTradeModal(id) {
    try {
        const response = await fetch(`/api/trades/${id}`);
        const trade = await response.json();
        
        const content = document.getElementById('modal-content');
        content.innerHTML = `
            <div class="grid grid-cols-2 gap-4">
                <div><span class="text-gray-400">Symbol:</span> <span class="font-bold">${trade.symbol}</span></div>
                <div><span class="text-gray-400">Direction:</span> <span class="${trade.direction === 'long' ? 'text-green-400' : 'text-red-400'}">${trade.direction.toUpperCase()}</span></div>
                <div><span class="text-gray-400">Entry Price:</span> $${trade.entry_price?.toFixed(2) || '--'}</div>
                <div><span class="text-gray-400">Exit Price:</span> $${trade.exit_price?.toFixed(2) || '--'}</div>
                <div><span class="text-gray-400">Position Size:</span> ${trade.position_size || '--'}</div>
                <div><span class="text-gray-400">P&L:</span> <span class="${trade.pnl >= 0 ? 'text-green-400' : 'text-red-400'}">$${trade.pnl?.toFixed(2) || '--'}</span></div>
                <div><span class="text-gray-400">Stop Loss:</span> $${trade.stop_loss?.toFixed(2) || '--'}</div>
                <div><span class="text-gray-400">Take Profit:</span> $${trade.take_profit?.toFixed(2) || '--'}</div>
                <div><span class="text-gray-400">Fees:</span> $${trade.fees?.toFixed(2) || '0.00'}</div>
                <div><span class="text-gray-400">Status:</span> ${trade.status}</div>
            </div>
            ${trade.notes ? `<div class="mt-3"><span class="text-gray-400">Notes:</span><p class="mt-1 text-sm">${trade.notes}</p></div>` : ''}
            ${trade.tags && trade.tags.length ? `<div class="mt-3"><span class="text-gray-400">Tags:</span><div class="flex gap-2 mt-1">${trade.tags.map(t => `<span class="px-2 py-1 bg-gray-700 rounded text-xs">${t}</span>`).join('')}</div></div>` : ''}
            ${trade.screenshot_path ? `<div class="mt-3"><span class="text-gray-400">Screenshot:</span><img src="${trade.screenshot_path}" class="mt-2 rounded max-w-full" alt="Trade screenshot"></div>` : ''}
            <div class="mt-3 text-sm text-gray-400">
                <div>Created: ${new Date(trade.created_at).toLocaleString()}</div>
                ${trade.exited_at ? `<div>Closed: ${new Date(trade.exited_at).toLocaleString()}</div>` : ''}
            </div>
        `;
        
        document.getElementById('trade-modal').classList.remove('hidden');
    } catch (error) {
        console.error('Failed to load trade:', error);
    }
}

function closeModal() {
    document.getElementById('trade-modal').classList.add('hidden');
}

async function deleteTrade(id) {
    if (!confirm('Delete this trade?')) return;
    try {
        await fetch(`/api/trades/${id}`, { method: 'DELETE' });
        loadTrades(currentPage);
    } catch (error) {
        console.error('Failed to delete trade:', error);
    }
}

loadTrades();

document.getElementById('filter-symbol').addEventListener('change', () => loadTrades(1));
document.getElementById('filter-direction').addEventListener('change', () => loadTrades(1));
document.getElementById('filter-start').addEventListener('change', () => loadTrades(1));
document.getElementById('filter-end').addEventListener('change', () => loadTrades(1));
</script>
{% endblock %}
